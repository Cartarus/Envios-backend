version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: envios_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - envios_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: envios_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres
    networks:
      - envios_network

  redis:
    image: redis:7-alpine
    container_name: envios_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - envios_network

volumes:
  postgres_data:

networks:
  envios_network:
    driver: bridge
